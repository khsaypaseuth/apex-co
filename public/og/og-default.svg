<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!--
    SV Consulting default Open Graph card (1200×630).
    Brand palette: navy-950 #0A1B2A, navy-700 #203D63, gold-500 #C8A53A, ivory-100 #F8F0DC.
    Fonts: Georgia/Times as a serif stand-in for Fraunces (webfont not available
    to the rasterizer at build time — see decision log D-072).
    Rasterized to og-default.png via @resvg/resvg-cli.
  -->
  <rect width="1200" height="630" fill="#0A1B2A"/>
  <!-- subtle navy-700 corner wash for depth -->
  <circle cx="1200" cy="0" r="560" fill="#203D63" opacity="0.35"/>
  <circle cx="0" cy="630" r="420" fill="#203D63" opacity="0.22"/>
  <!-- thin gold frame rules -->
  <rect x="56" y="56" width="1088" height="518" fill="none" stroke="#C8A53A" stroke-width="1.5" opacity="0.55"/>
  <!-- gold rule above the wordmark -->
  <rect x="120" y="238" width="96" height="2" fill="#C8A53A"/>
  <!-- wordmark -->
  <text x="120" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="88" fill="#F8F0DC">SV Consulting</text>
  <!-- tagline -->
  <text x="120" y="398" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#C8A53A" letter-spacing="1">Business, Legal &amp; Visa Consulting in Laos</text>
  <!-- parent company line -->
  <text x="120" y="502" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#F8F0DC" opacity="0.55" letter-spacing="2">SUPER VISION CO., LTD. — VIENTIANE, LAO PDR</text>
</svg>
